[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finanzen-common"
version = "0.1.0"
description = "Reusable request fingerprint strategies for FinanZen idempotency"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
