# Free web service; persistent data lives in external Neon PostgreSQL.
# DATABASE_URL is entered privately when creating the Blueprint.
services:
  - type: web
    name: finanzen-financial-records
    runtime: python
    plan: free
    region: virginia
    repo: https://github.com/1ASI0657-2620-9199/back
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
