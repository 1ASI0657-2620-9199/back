# Prepared configuration. Creating these resources incurs recurring charges.
# Apply only after the account owner accepts the compute and disk costs.
services:
  - type: web
    name: finanzen-financial-records
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    repo: https://github.com/1ASI0657-2620-9199/back
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FINANZEN_DB_PATH
        value: /var/data/financial_records.db
    disk:
      name: finanzen-records
      mountPath: /var/data
      sizeGB: 1
