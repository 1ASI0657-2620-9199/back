name: Docker and Kafka integration

on:
  push:
    paths:
      - 'app/**'
      - 'services/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/docker.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributed-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: finanzen-ci
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
        with:
          path: back
      - uses: actions/checkout@v7
        with:
          repository: 1ASI0657-2620-9199/front
          ref: ${{ vars.FRONTEND_REF || github.head_ref || github.ref_name }}
          path: front
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            back/requirements-kafka.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-kafka.txt
      - run: mkdir -p reports
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: docker compose --profile test run --build --rm tests
      - run: python scripts/verify_docker.py --faults > reports/docker-checks.log 2>&1
      - run: npx --yes newman run postman/FinanZen-Sprints-2-3.postman_collection.json --env-var baseUrl=http://127.0.0.1:8080 --delay-request 150 --reporters cli,json --reporter-json-export reports/newman-kafka.json
      - if: always()
        run: |
          docker compose ps -a > reports/containers.txt
          docker compose logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docker-kafka-evidence
          path: back/reports
      - if: always()
        run: docker compose down
