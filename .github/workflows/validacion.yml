name: Validación backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: finanzen-ci
          POSTGRES_DB: finanzen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finanzen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:finanzen-ci@127.0.0.1:5432/finanzen_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            libraries/finanzen_common/pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m behave features --junit --junit-directory reports/bdd
      - run: python -m build libraries/finanzen_common
      - uses: actions/upload-artifact@v6
        with:
          name: bdd-and-common-library
          path: |
            reports/bdd
            libraries/finanzen_common/dist
